name: Reproduce research evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Reproduce authored challenges without networking
        run: python reproduce.py --offline --quick --output results/ci-offline
      - name: Verify paper evidence coverage and frozen hashes
        run: python tools/audit_traceability.py --output results/ci-offline/traceability.json
      - name: Upload offline artifacts
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f46cd9
        if: always()
        with:
          name: offline-python-${{ matrix.python }}
          path: results/ci-offline

  pinned-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Acquire verified pins and reproduce full deterministic outcomes
        run: python reproduce.py --quick --output results/ci-source
      - name: Upload pinned-source artifacts
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f46cd9
        if: always()
        with:
          name: pinned-source-python312
          path: |
            results/ci-source/assay
            results/ci-source/regenerated
            results/ci-source/reproduction.json
            results/ci-source/*.log
          # External *.local.json payload inputs are deliberately excluded.

  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate SPDX SBOM
        # anchore/sbom-action v0.24.3
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f46cd9
        with:
          name: sbom-spdx
          path: sbom.spdx.json
